<div class="table-scroll">
  <table
    mat-table
    [dataSource]="store.items()"
    [trackBy]="trackById"
    matSort
    [matSortActive]="store.sortBy()"
    [matSortDirection]="store.sortOrder()"
    [matSortDisableClear]="true"
    (matSortChange)="onSort($event)"
  >
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let item">{{ item.name }}</td>
    </ng-container>

    <ng-container matColumnDef="restaurantName">
      <th mat-header-cell *matHeaderCellDef>Restaurant</th>
      <td mat-cell *matCellDef="let item">{{ item.restaurantName }}</td>
    </ng-container>

    <ng-container matColumnDef="branchName">
      <th mat-header-cell *matHeaderCellDef>Branch</th>
      <td mat-cell *matCellDef="let item">{{ item.branchName }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let item">{{ item.category }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
      <td mat-cell *matCellDef="let item">{{ item.price | number: '1.2-2' }}</td>
    </ng-container>

    <ng-container matColumnDef="available">
      <th mat-header-cell *matHeaderCellDef>Available</th>
      <td mat-cell *matCellDef="let item">
        @if (item.available) {
          Available
        } @else {
          Unavailable
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="lastUpdated">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Last updated</th>
      <td mat-cell *matCellDef="let item">{{ item.lastUpdated | date: 'medium' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let item">
        <button mat-icon-button type="button" [attr.aria-label]="'Edit ' + item.name" (click)="edit(item)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<mat-paginator
  [length]="store.total()"
  [pageSize]="store.pageSize()"
  [pageIndex]="store.page() - 1"
  [pageSizeOptions]="pageSizeOptions"
  (page)="onPage($event)"
/>
