<div class="table-scroll" [class.compact]="density() === 'compact'" [class.dimmed]="store.status() === 'loading'">
  @if (store.status() === 'loading') {
    <div class="progress" aria-hidden="true"></div>
  }
  <table
    mat-table
    [dataSource]="store.items()"
    [trackBy]="trackById"
    matSort
    [matSortActive]="store.sortBy()"
    [matSortDirection]="store.sortOrder()"
    [matSortDisableClear]="true"
    (matSortChange)="onSort($event)"
  >
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let item" data-label="Name">
        <span class="item-name">{{ item.name }}</span>
        <span class="item-meta">{{ item.restaurantName }} · {{ item.branchName }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let item" data-label="Category">{{ item.category }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="numeric">Price</th>
      <td mat-cell *matCellDef="let item" data-label="Price" class="numeric tabular">
        {{ item.price | number: '1.2-2' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="available">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let item" data-label="Status">
        <span class="pill" [class.off]="!item.available">
          <span class="dot" aria-hidden="true"></span>
          {{ item.available ? 'Available' : 'Unavailable' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="lastUpdated">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Last updated</th>
      <td
        mat-cell
        *matCellDef="let item"
        data-label="Last updated"
        class="tabular"
        [attr.title]="item.lastUpdated | date: 'medium'"
      >
        {{ relative(item.lastUpdated) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let item" data-label="Actions">
        <button
          matIconButton
          type="button"
          [attr.aria-label]="'Edit ' + item.name"
          (click)="$event.stopPropagation(); edit(item)"
        >
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      tabindex="0"
      class="data-row"
      [class.updated]="highlightedId() === row.id"
      (click)="edit(row)"
      (keydown.enter)="edit(row)"
    ></tr>
  </table>
</div>

<mat-paginator
  [length]="store.total()"
  [pageSize]="store.pageSize()"
  [pageIndex]="store.page() - 1"
  [pageSizeOptions]="pageSizeOptions"
  (page)="onPage($event)"
/>
