<app-page-header
  title="Dashboard"
  summary="See whether the menu is stocked, and which categories carry the most items."
/>

@if (statsStore.status() === 'error') {
  <div class="state" role="alert">
    <p>{{ statsStore.error() }}</p>
    <p>The menu totals could not be loaded. Try the request again.</p>
    <button type="button" matButton="filled" (click)="statsStore.retry()">Retry</button>
  </div>
} @else if (statsStore.stats(); as stats) {
  <app-menu-health [stats]="stats" />
  <app-category-chart [counts]="stats.byCategory" />
} @else {
  <div class="skeleton" aria-hidden="true">
    <div class="block health"></div>
    @for (row of skeletonRows; track row) {
      <div class="block line"></div>
    }
  </div>
  <p class="sr-only">Loading menu health</p>
}
